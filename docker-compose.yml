services:
  mariadb:
    image: mariadb:lts
    container_name: mariadb_server
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PWD}
      MARIADB_DATABASE: scheduling_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PWD}
